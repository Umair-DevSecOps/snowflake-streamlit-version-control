name: Streamlit CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Check Python syntax
        run: python -m py_compile DEVOPS_VERSION_CONTROL_DEMO/streamlit_app.py
